[project]
name = "paper-sources-mcp"
version = "0.1.0"
description = "MCP server pooling scholarly search across OpenAlex, Europe PMC, PubMed, arXiv and bioRxiv/medRxiv, with open full text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jayoung Ryu" }]
keywords = ["mcp", "model-context-protocol", "literature", "openalex", "pubmed", "arxiv", "biorxiv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "beautifulsoup4>=4.12",  # full-text parsing (arXiv HTML, JATS XML)
    "httpx>=0.27",
    "lxml>=5",
    "mcp>=1.9,<2",
    "pypdf>=5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# bioRxiv full text from its requester-pays S3 buckets (LC_BIORXIV_S3=1).
s3 = ["boto3>=1.35"]

[project.scripts]
paper-sources-mcp = "paper_sources_mcp.server:main"

[project.urls]
Repository = "https://github.com/jykr/literature_reviewer_agent"
Documentation = "https://github.com/jykr/literature_reviewer_agent/blob/main/docs/paper-sources-mcp.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sources_mcp"]
